<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf9f5" />
    <title>岩间 · 侧上方</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #393e39;
        --muted: #74796e;
        --accent: #c97551;
        --line: #e5e6dc;
        --paper: #faf9f5;
        --wall: #f1f2ec;
      }

      * {
        box-sizing: border-box;
        letter-spacing: 0;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      body {
        height: 100dvh;
        min-height: 340px;
        display: grid;
        grid-template-rows: auto minmax(180px, 1fr) auto;
        background: var(--paper);
        color: var(--ink);
        font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
        overscroll-behavior: none;
      }

      button,
      a {
        color: inherit;
        font: inherit;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        cursor: default;
        opacity: 0.3;
      }

      button:focus-visible,
      a:focus-visible,
      .keyboard-navigation canvas:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -3px;
      }

      header {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 12px;
        padding: 12px max(20px, env(safe-area-inset-right)) 12px
          max(20px, env(safe-area-inset-left));
        padding-top: max(12px, env(safe-area-inset-top));
        background: var(--paper);
        border-bottom: 1px solid transparent;
      }

      h1 {
        margin: 0;
        font-size: 25px;
        line-height: 1.2;
        font-family: "STSong", "SimSun", serif;
        font-weight: 400;
        letter-spacing: 2px;
      }

      h1 span {
        color: var(--accent);
      }

      .brand small {
        display: block;
        margin-top: 4px;
        font-size: 9px;
        color: var(--muted);
        font-family: "Segoe UI", sans-serif;
      }

      .route {
        position: relative;
        display: flex;
        align-items: center;
        width: 126px;
        min-height: 44px;
        font-size: 13px;
        white-space: nowrap;
      }

      .route i {
        position: absolute;
        left: 6px;
        width: 7px;
        height: 7px;
        background: #6682be;
        border-radius: 50%;
        pointer-events: none;
      }

      .view-tools {
        position: absolute;
        right: 12px;
        bottom: 12px;
        display: flex;
        padding: 2px;
        border-radius: 12px;
        background: #faf9f5e8;
      }
      .view-tools .icon-button {
        width: 44px;
        height: 44px;
        flex-basis: 44px;
        font-size: 12px;
        color: #606c5f;
      }
      .view-tools .icon-button svg { width: 17px; height: 17px; }

      .route select {
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        height: 44px;
        padding: 0 22px 0 22px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      .route select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }

      .route select:disabled {
        opacity: 0.5;
      }

      .route svg {
        position: absolute;
        right: 4px;
        width: 14px;
        height: 14px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        pointer-events: none;
      }

      .header-actions,
      .history,
      .draft-tools,
      .turn {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .header-actions {
        justify-self: end;
      }

      .icon-button {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 44px;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        border-radius: 10px;
        background: transparent;
        text-decoration: none;
        transition: background 0.12s;
      }

      .icon-button svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        pointer-events: none;
      }

      .icon-button:active:not(:disabled) {
        background: #e4e7dc;
      }

      .icon-button::after {
        content: attr(data-tip);
        position: absolute;
        left: 50%;
        bottom: calc(100% + 8px);
        transform: translateX(-50%);
        padding: 6px 9px;
        border-radius: 4px;
        background: #303a36;
        color: white;
        font-size: 11px;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        z-index: 5;
      }

      .header-actions .icon-button::after {
        top: calc(100% + 8px);
        bottom: auto;
        left: auto;
        right: 0;
        transform: none;
      }

      .draft-tools {
        pointer-events: auto;
        gap: 2px;
      }

      .draft-tools .counter {
        margin-right: 6px;
      }

      .draft-tools .icon-button::after {
        top: calc(100% + 5px);
        bottom: auto;
        left: auto;
        right: 0;
        transform: none;
      }

      #swapDraft:not(:disabled) {
        color: #416958;
      }

      #undo:not(:disabled) {
        background: #e7eadd;
        color: #345443;
      }

      @media (hover: hover) {
        .icon-button:hover:not(:disabled) {
          background: #eeeee6;
        }

        .icon-button:hover:not(:disabled)::after {
          opacity: 1;
        }
      }

      .icon-button:focus-visible::after {
        opacity: 1;
      }

      .stage {
        position: relative;
        min-height: 0;
        overflow: hidden;
        isolation: isolate;
        background: var(--wall);
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
      }

      .stage-meta {
        position: absolute;
        top: 17px;
        left: 22px;
        right: 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        pointer-events: none;
        font-size: 11px;
        color: var(--muted);
      }

      .selection {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 80px;
        height: 22px;
      }

      .selection::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent);
        opacity: 0;
      }

      .selection.active::before {
        opacity: 1;
      }

      .counter {
        font-variant-numeric: tabular-nums;
      }

      .counter b {
        color: #46564b;
        font-size: 13px;
        font-weight: 600;
        margin-right: 5px;
      }

      .outcome {
        position: absolute;
        bottom: 64px;
        left: 0;
        right: 0;
        text-align: center;
        pointer-events: none;
        font-size: 14px;
        color: #41644a;
        font-weight: 600;
      }

      .outcome[hidden] {
        display: none;
      }

      .pick {
        position: absolute;
        width: 48px;
        height: 48px;
        margin: -24px 0 0 -24px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: transparent;
        pointer-events: none;
      }

      .pick:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 0;
      }

      footer {
        background: var(--paper);
        border-top: 1px solid transparent;
        padding: 10px max(18px, env(safe-area-inset-right))
          max(10px, env(safe-area-inset-bottom))
          max(18px, env(safe-area-inset-left));
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        max-width: 540px;
        margin: auto;
      }

      .turn {
        gap: 3px;
      }

      .turn output {
        width: 62px;
        text-align: center;
        font-size: 12px;
        color: #617469;
      }

      .turn button {
        color: #486455;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 420px) {
        header {
          padding-left: max(16px, env(safe-area-inset-left));
          padding-right: max(12px, env(safe-area-inset-right));
          gap: 8px;
        }

        h1 {
          font-size: 23px;
        }

        .route {
          font-size: 12px;
          width: 116px;
        }

        .stage-meta {
          left: 18px;
          right: 18px;
        }
      }

      @media (max-height: 500px) {
        header {
          padding-top: 5px;
          padding-bottom: 5px;
        }

        .brand small {
          display: none;
        }

        footer {
          padding-top: 3px;
          padding-bottom: max(3px, env(safe-area-inset-bottom));
        }

        .stage-meta {
          top: 6px;
        }

        .outcome {
          bottom: 5px;
        }
      }

      @media (max-width: 380px) {
        footer {
          padding-left: 12px;
          padding-right: 12px;
        }

        .controls {
          gap: 4px;
        }

        .history,
        .turn {
          gap: 0;
        }

        .turn output {
          width: 40px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <div class="brand">
        <h1>岩<span>间</span></h1>
        <small>BETWEEN HOLDS</small>
      </div>
      <div class="route">
        <i id="routeDot" aria-hidden="true"></i>
        <select id="routeSelect" aria-label="选择线路">
          <option value="side">01 侧上方</option>
          <option value="traverse">02 横移</option>
          <option value="rise">03 高一步</option>
          <option value="fork">04 两条路</option>
          <option value="return">05 折返</option>
          <option value="ladder">06 绕过屋檐</option>
          <option value="switch">07 回旋</option>
          <option value="west">08 长路回家</option>
        </select>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 9 6 6 6-6" />
        </svg>
      </div>
      <div class="header-actions">
        <button
          id="reset"
          class="icon-button"
          aria-label="重新开始"
          data-tip="重新开始"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 9V7a2 2 0 0 0-2-2h-6" />
            <path d="m15 2-3 3 3 3" />
            <path
              d="M20 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"
            />
          </svg>
        </button>
      </div>
    </header>
    <main class="stage" aria-label="攀岩练习">
      <canvas id="canvas" tabindex="0" aria-label="岩间攀岩墙"></canvas>
      <div class="stage-meta">
        <span id="selection" class="selection"></span>
        <div class="draft-tools" role="group" aria-label="姿势对照">
          <span class="counter"><b id="moveCount">00</b>次换点</span>
          <button
            id="saveDraft"
            class="icon-button"
            aria-label="保留姿势"
            data-tip="保留姿势"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z" />
              <line x1="12" x2="12" y1="7" y2="13" />
              <line x1="15" x2="9" y1="10" y2="10" />
            </svg>
          </button>
          <button
            id="swapDraft"
            class="icon-button"
            aria-label="切换对照姿势"
            data-tip="切换对照姿势"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3 4 7l4 4" />
              <path d="M4 7h16" />
              <path d="m16 21 4-4-4-4" />
              <path d="M20 17H4" />
            </svg>
          </button>
        </div>
      </div>
      <button
        class="pick"
        data-limb="0"
        aria-label="左手"
        aria-pressed="false"
      ></button>
      <button
        class="pick"
        data-limb="1"
        aria-label="右手"
        aria-pressed="false"
      ></button>
      <button
        class="pick"
        data-limb="2"
        aria-label="左脚"
        aria-pressed="false"
      ></button>
      <button
        class="pick"
        data-limb="3"
        aria-label="右脚"
        aria-pressed="false"
      ></button>
      <button class="pick" id="hipTarget" aria-label="重心"></button>
      <button class="pick" id="chestTarget" aria-label="胸肩侧身"></button>
      <div id="poseNote" class="outcome" role="status" hidden></div>
      <div id="announcement" class="sr-only" aria-live="polite"></div>
      <select
        id="balanceAid"
        aria-label="重心辅助"
        style="
          position: absolute;
          bottom: 14px;
          left: 16px;
          min-height: 36px;
          max-width: 110px;
          border: 1px solid transparent;
          border-radius: 10px;
          background: #faf9f5d9;
          color: #606c5f;
          padding: 5px;
          font: 12px inherit;
        "
      >
        <option value="auto">重心 · 自动</option>
        <option value="on">重心 · 常开</option>
        <option value="off">重心 · 关闭</option>
      </select>
      <div class="view-tools" role="group" aria-label="岩壁视角">
        <button id="viewOut" class="icon-button" aria-label="缩小视角" data-tip="缩小">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
        </button>
        <button id="viewIn" class="icon-button" aria-label="放大视角" data-tip="放大">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>
        </button>
        <button id="viewFit" class="icon-button" aria-label="查看整条线路" data-tip="查看整条线路">全线</button>
        <button id="viewPerson" class="icon-button" aria-label="回到人物" data-tip="回到人物">人物</button>
      </div>
      <span
        id="routeScale"
        style="
          position: absolute;
          bottom: 62px;
          right: 18px;
          font-size: 11px;
          color: var(--muted);
          pointer-events: none;
        "
      ></span>
    </main>
    <footer>
      <div class="controls">
        <div class="history" role="group" aria-label="动作历史">
          <button
            id="undo"
            class="icon-button"
            aria-label="撤销"
            data-tip="退一步"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 14 4 9l5-5" />
              <path
                d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"
              />
            </svg>
          </button>
          <button
            id="redo"
            class="icon-button"
            aria-label="重做"
            data-tip="重做"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 14 5-5-5-5" />
              <path
                d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13"
              />
            </svg>
          </button>
        </div>
        <button
          id="openPhotos"
          class="icon-button"
          aria-label="照片线路"
          data-tip="照片线路"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"
            />
            <circle cx="12" cy="13" r="3" />
          </svg>
        </button>
        <div class="turn" role="group" aria-label="身体朝向">
          <button
            id="turnLeft"
            class="icon-button"
            aria-label="向左侧身"
            data-tip="向左侧身"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
            </svg>
          </button>
          <output id="orientation" aria-live="polite">正对</output>
          <button
            id="turnRight"
            class="icon-button"
            aria-label="向右侧身"
            data-tip="向右侧身"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
              <path d="M21 3v5h-5" />
            </svg>
          </button>
        </div>
      </div>
    </footer>
    <style>
      #photoEditor {
        padding: 0;
        border: 0;
        width: 100vw;
        max-width: none;
        height: 100dvh;
        max-height: none;
        margin: 0;
        color: var(--ink);
        background: var(--wall);
      }

      #photoEditor[open] {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
      }

      #photoEditor::backdrop {
        background: #28333466;
      }

      #photoEditor [hidden] {
        display: none !important;
      }

      .photo-head,
      .photo-bottom {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px max(16px, env(safe-area-inset-right)) 10px
          max(16px, env(safe-area-inset-left));
        background: var(--paper);
        border-bottom: 1px solid var(--line);
      }

      .photo-head {
        padding-top: max(10px, env(safe-area-inset-top));
      }

      .photo-head h2 {
        font-size: 17px;
        margin: 0;
        flex: 1;
      }

      .photo-bottom {
        border-top: 1px solid var(--line);
        border-bottom: 0;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        flex-wrap: wrap;
      }

      .photo-bottom output {
        flex: 1;
        font-size: 12px;
        min-width: 140px;
        color: #546861;
      }

      .photo-bottom output[data-error="true"] {
        color: #a43e32;
      }

      .photo-work {
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
      }

      .photo-picture {
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: auto;
        background: var(--wall);
      }

      #photoCanvas {
        display: block;
        position: static;
        touch-action: none;
        width: auto;
        height: auto;
      }

      .photo-side {
        overflow: auto;
        padding: 16px;
        border-left: 1px solid var(--line);
        background: var(--paper);
      }

      .photo-side h3 {
        font-size: 14px;
        margin: 20px 0 10px;
      }

      .photo-side details {
        margin-top: 14px;
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }

      .photo-side summary {
        cursor: pointer;
        font-size: 13px;
        color: #587064;
        min-height: 32px;
      }

      #photoSaved {
        font-size: 11px;
        color: #587064;
      }

      #photoChoices {
        margin: 10px 0;
      }

      #photoSave {
        grid-column: 2;
        grid-row: 3;
        justify-self: start;
      }

      .photo-side label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-size: 13px;
        margin: 10px 0;
      }

      .photo-side input:not([type="checkbox"]):not([type="range"]),
      .photo-side select {
        width: 145px;
        min-width: 0;
        border: 1px solid #cdd8d2;
        border-radius: 4px;
        min-height: 38px;
        padding: 6px;
        font: inherit;
        background: white;
        color: inherit;
      }

      .photo-side input[type="range"] {
        width: 100%;
        min-height: 36px;
        accent-color: #597a6a;
      }
      .photo-size-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
      .photo-command[aria-pressed="true"] { background: #e9e1d5; }
      #photoColors { margin: 18px 0; }
      #photoColors button { display: flex; align-items: center; gap: 8px; }
      #photoColors i { width: 18px; height: 18px; border-radius: 50%; }

      .photo-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
      }

      .photo-command {
        border: 1px solid #cdd8d2;
        background: #fff;
        color: #344b40;
        border-radius: 6px;
        min-height: 40px;
        padding: 8px 12px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      .photo-command.primary {
        background: #416658;
        color: white;
        border-color: #416658;
      }

      .photo-command:disabled {
        opacity: 0.45;
        cursor: default;
      }

      .photo-row .icon-button {
        border-radius: 6px;
        background: #f1f5f2;
      }

      .photo-row .icon-button[aria-pressed="true"] {
        color: #b35130;
        background: #f4e5da;
      }

      #photoCount,
      .photo-privacy {
        font-size: 12px;
        color: var(--muted);
      }

      .photo-library {
        overflow: auto;
        padding: 20px;
      }

      .photo-library h3 {
        font-size: 15px;
        margin: 24px 0 12px;
      }

      .photo-record {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }

      .photo-record strong {
        flex: 1;

    <dialog id="photoEditor" aria-labelledby="photoTitle">
      <div class="photo-head">
        <h2 id="photoTitle">照片线路</h2>
        <span id="photoSteps"></span>
        <button
          id="photoClose"
          class="icon-button"
          aria-label="关闭照片编辑"
          title="关闭照片编辑"
        >
          <svg viewBox="0 0 24 24">
            <path d="m18 6-12 12M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div id="photoLibrary" class="photo-library">
        <div class="photo-row">
          <button id="photoChoose" class="photo-command primary">
            选择照片
          </button>
          <button id="photoCamera" class="photo-command">拍照</button>
        </div>
        <p class="photo-privacy">

          清除浏览器数据会删除本机线路。

        <h3>我的线路</h3>
        <div id="photoRecords"></div>
      </div>
      <div id="photoWork" class="photo-work" hidden>
        <div id="photoPicture" class="photo-picture">

            tabindex="0"
          ></canvas>
        </div>
        <div class="photo-side">
          <section id="photoSourcePanel">
            <h3>把这面墙，变成一次尝试</h3>
            <div id="photoMethodRow" class="photo-row" hidden>
              <label for="photoMethod">生成方式</label>

                <option value="ai">AI 视觉 · 试用</option>

            <div id="photoColors" class="photo-row" hidden></div>
          </section>
          <section id="photoSetupPanel" hidden>
            <div class="photo-row">
              <button id="photoOriginal" class="photo-command" aria-pressed="false">原图</button>
              <button id="photoEdit" class="photo-command" aria-pressed="false">改一下</button>
            </div>
            <h3>摆一个自己</h3>
            <label for="photoSize">人物大小</label>
            <input id="photoSize" aria-label="人物大小" type="range" min=".65" max="1.6" step=".05" value="1" />
            <div class="photo-size-ends"><span>较小</span><span>较大</span></div>

                data-photo-mode="select"
                aria-label="选择和移动岩点"
                title="选择和移动岩点"
              >
                <svg viewBox="0 0 24 24">
                  <path d="m3 3 7 19 3-9 9-3z" />
                </svg>
              </button>
              <button
                class="icon-button"
                data-photo-mode="add"
                aria-label="添加岩点"
                title="添加岩点"
              >
                <svg viewBox="0 0 24 24">
                  <path d="M12 5v14M5 12h14" />
                </svg>
              </button>
              <button
                class="icon-button"
                data-photo-mode="color"
                aria-label="补一组同色岩点"
                title="补一组同色岩点"
              >
                <svg viewBox="0 0 24 24">
                  <path d="m16 3 5 5M4 16l12-12 4 4L8 20H4zM14 6l4 4" />
                </svg>
              </button>
              <button
                id="photoUndo"
                class="icon-button"
                aria-label="撤销标点"
                title="撤销标点"
              >
                <svg viewBox="0 0 24 24">
                  <path d="m9 14-5-5 5-5M4 9h10a6 6 0 0 1 0 12" />
                </svg>
              </button>
              <button
                id="photoDeletePoint"
                class="icon-button"
                aria-label="删除选中岩点"
                title="删除选中岩点"
              >
                <svg viewBox="0 0 24 24">
                  <path
                    d="M3 6h18M9 6V4h6v2M5 6l1 14h12l1-14M10 10v6M14 10v6"
                  />
                </svg>
              </button>
            </div>
            <p class="photo-privacy">拖动岩点调整抓踩位置，点空处补点；轮廓留在原处。</p>
            <div id="photoCandidateActions" class="photo-row" hidden>
              <button id="photoAccept" class="photo-command" disabled>
                添加候选
              </button>
              <button id="photoReject" class="photo-command" disabled>
                清除候选
              </button>
            </div>
          </section>
        </div>
      </div>
      <div class="photo-bottom">
        <output id="photoStatus" role="status"

        <output id="photoSaved" aria-live="polite"></output>
        <button id="photoBack" class="photo-command" hidden>返回照片</button>
        <button id="photoSave" class="photo-command" hidden>重试保存</button>
        <button id="photoCancelAI" class="photo-command" hidden>取消识别</button>
        <button id="photoNext" class="photo-command primary" hidden>
          下一步
        </button>
      </div>
      <input
        id="photoFile"
        type="file"
        accept="image/jpeg,image/png,image/webp,image/heic,image/heif"
        hidden
      />
      <input
        id="photoCapture"
        type="file"
        accept="image/*"
        capture="environment"
        hidden
      />
    </dialog>

                    p.shape.outline.some(q=>q.x>source.width||q.y>source.height) ||
                    !engine.insideOutline(p,p.shape.outline)))
                throw new Error("AI 岩点数据不完整，没有修改草稿。");
            }
            visionRejected = Number.isInteger(result.rejected) ? result.rejected : 0;
            visionGroups = result.routes;
            if (visionGroups.length === 1) { applyVisionGroup(visionGroups[0]); return; }
            const list = $("photoColors");
            list.hidden = false;
            visionGroups.forEach(group => {
              const button = actionButton(group.name+" · "+group.points.length+" 个",()=>applyVisionGroup(group)),
                swatch = document.createElement("i");
              swatch.style.background = group.color;
              button.prepend(swatch);
              list.append(button);
            });
            mode = "ai-choice";
            status("AI 找到了几组颜色，选一条或点照片上的岩点。"+
              (result.rejected ? "部分无效轮廓已略过，生成后可补点。" : ""));
          } catch (error) {
            if (token === epoch && dialog.open) status(controller.signal.aborted
              ? "已取消识别，照片草稿仍保留。"
              : (error.name === "TimeoutError" ? "AI 响应超时。" : error.message)+
                " 可重试，或将生成方式改为本机颜色识别。", !controller.signal.aborted);
          } finally {
            if (visionController === controller) {
              visionController = null;
              busy = false;
              refresh();
            }
          }
        }
        $("photoMethod").onchange = () => {
          visionGroups = [];
          $("photoColors").replaceChildren();
          $("photoColors").hidden = true;
          mode = "view";
          refreshMethod();
        };
        $("photoCancelAI").onclick = () => visionController?.abort();
        function generateWall() {
          if (draft.points.length) { preparePreview(); return; }
          // Local hue proposals only. Large background regions are rejected
          // by the same component detector used by point correction.
          const c = document.createElement("canvas");
          c.width = 96;
          c.height = Math.max(1, Math.round(96 * source.height / source.width));
          c.getContext("2d").drawImage(source, 0, 0, c.width, c.height);
          const pixels = c.getContext("2d").getImageData(0, 0, c.width, c.height).data,
            bins = new Map();
          for (let i = 0; i < pixels.length; i += 4) {
            const [h, s, v] = hsv(...pixels.slice(i, i + 3));
            if (s < .2 || v < .16) continue;
            const key = Math.round(h / 30) % 12;
            if (!bins.has(key)) bins.set(key, { count: 0, saturation: -1 });
            const bin = bins.get(key);
            if (s > bin.saturation) Object.assign(bin, { saturation: s, h, p: {
              x: ((i / 4 % c.width) + .5) * source.width / c.width,
              y: (Math.floor(i / 4 / c.width) + .5) * source.height / c.height,
            } });
            bin.count++;
          }
          const groups = [];
          for (const b of [...bins.values()].sort((a,b) => b.count - a.count).slice(0, 8)) {
            if (b.count < Math.max(5, c.width * c.height * .001)) continue;
            if (groups.some(g => Math.min(Math.abs(g.h-b.h), 360-Math.abs(g.h-b.h)) < 32)) continue;
            const ratio = Math.min(1, 1200 / Math.max(source.width, source.height));
            const points = detect(b.p, -1, true).filter(p =>
              p.area >= 25 && (!p.shape ||
                p.area / (Math.abs(engine.outlineArea(p.shape.outline)) * ratio * ratio) > .3),
            );
            if (points.length >= 2) groups.push({ ...b, points });
          }
          const apply = group => {
            candidates = group.points;
            acceptCandidates();
            preparePreview();
          };
          if (groups.length === 1) { apply(groups[0]); return; }
          if (!groups.length) {
            preparePreview();
            editing = true;
            original = true;
            mode = "select";
            refresh();
            status("没找到清楚的同色岩点。点照片补几个抓踩位置，再看生成效果。");
            return;
          }
          const list = $("photoColors");
          list.replaceChildren();
          list.hidden = false;
          groups.slice(0, 6).forEach((group, i) => {
            const button = actionButton("线路 " + (i + 1), () => apply(group)),
              swatch = document.createElement("i");
            swatch.style.background = group.points[0].shape?.color || "#6883b2";
            button.prepend(swatch);
            list.append(button);
          });
          mode = "color-choice";
          status("想试哪条？选一个颜色，或点照片上的岩点。");
        }
        function pointFrom(event) {
          const r = canvas.getBoundingClientRect();
          return {
            x: (event.clientX - r.left) / factor,
            y: (event.clientY - r.top) / factor,
          };
        }
        function cancelPointer() {
          if (!gesture) return;
          const id = gesture.id;
          draft = gesture.before;
          gesture = null;
          if (canvas.hasPointerCapture(id)) canvas.releasePointerCapture(id);
          refresh();
        }
        canvas.addEventListener("pointerdown", (event) => {
          if (busy || gesture || event.button !== 0 || mode === "view") return;
          clearTimeout(saveTimer);
          const p = pointFrom(event);
          if (p.x < 0 || p.y < 0 || p.x > source.width || p.y > source.height) return;
          gesture = {
            id: event.pointerId,
            p,
            before: copy(draft),
            moved: false,
          };
          canvas.setPointerCapture(event.pointerId);
          if (mode === "select") {
            selected =
              draft.points
                .map((q, i) => ({ i, d: dist(p, q) * factor }))
                .sort((a, b) => a.d - b.d)
                .find((q) => q.d <= 20)?.i ??
              (original ? draft.points : visualPoints(draft)).findIndex(
                (q) => q.shape && engine.insideOutline(p, q.shape.outline),
              );
          }
          refresh();
        });
        canvas.addEventListener("pointermove", (event) => {
          if (!gesture || event.pointerId !== gesture.id) return;
          const p = pointFrom(event);
          if (dist(p, gesture.p) * factor > 5) gesture.moved = true;
          if (mode === "select" && selected >= 0 && gesture.moved) {
            Object.assign(draft.points[selected], {
              x: clamp(p.x, 0, source.width), y: clamp(p.y, 0, source.height),
            });
            draft.hip = null;
          }
          draw();
        });
        canvas.addEventListener("pointerup", (event) => {
          if (!gesture || event.pointerId !== gesture.id) return;
          const p = pointFrom(event),
            g = gesture;
          gesture = null;
          if (canvas.hasPointerCapture(event.pointerId))
            canvas.releasePointerCapture(event.pointerId);
          if (mode === "select" && selected >= 0 && g.moved) {
            history.push(g.before);
            if (history.length > 60) history.shift();
            dirty = true;
            invalidate();
          }
          if (!g.moved) {
            if (p.x < 0 || p.y < 0 || p.x > source.width || p.y > source.height) { refresh(); return; }
            if (mode === "start") {
              const pick = draft.points
                .map((p, i) => ({ i, d: dist(p, pointFrom(event)) * factor }))
                .filter(
                  (q) => draft.points[q.i].type === "jug" && q.i !== draft.top && !pinned.includes(q.i),
                )
                .sort((a, b) => a.d - b.d)[0];
              if (pick && pick.d < 24) {
                pinned[pickHand] = pick.i;
                pickHand++;
                if (pickHand === 2) {
                  mode = "view";
                  draft.hip = null;
                  status("起手已选好，点“开始爬”试试。");
                } else status("再点一个右手起点。");
              }
            } else if (mode === "add" || (mode === "select" && selected < 0)) {
              if (draft.points.length >= 100) {
                status("最多 100 个岩点。", true);
                return;
              }
              savePoint();
              draft.points.push({ ...p, type: "jug" });
              selected = draft.points.length - 1;
              detect(p, selected);
              invalidate();
            } else if (mode === "ai-choice") {
              const group = visionGroups.find(group =>
                group.points.some(q => engine.insideOutline(p,q.shape.outline)));
              if (group) applyVisionGroup(group);
              else status("这里不在 AI 轮廓内，可以直接选择右侧颜色。");
              return;
            } else if (mode === "color-choice") {
              detect(p);
              if (candidates.length) {
                acceptCandidates();
                preparePreview();
              }
              return;
            } else if (mode === "color") {
              detect(p);
              return;
            }
          }
          refresh();
        });
        canvas.addEventListener("pointercancel", cancelPointer);
        canvas.addEventListener("lostpointercapture", cancelPointer);
        window.addEventListener("resize", () => {
          cancelPointer();
          draw();
        });
        $("photoOriginal").onclick = () => {
          cancelPointer();
          original = !original;
          mode = editing ? "select" : "view";
          candidates = [];
          refresh();
        };
        $("photoEdit").onclick = () => {
          cancelPointer();
          editing = !editing;
          mode = editing ? "select" : "view";
          candidates = [];
          refresh();
          status(editing ? "拖动调整，点空处补点；选中后可以删除。" : "调好大小就开始。");
        };
        document.querySelectorAll("[data-photo-mode]").forEach(
          (button) =>
            (button.onclick = () => {
              cancelPointer();
              mode = button.dataset.photoMode;
              if (mode === "color") original = true;
              canvas.style.touchAction = "none";
              refresh();
              status(
                mode === "add"
                  ? "在照片上点选接触位置。"
                  : mode === "color"
                    ? "点选目标岩点的颜色。"
                    : "选择岩点后可拖动修正。",
              );
            }),
        );
        $("photoAccept").onclick = acceptCandidates;
        $("photoReject").onclick = () => {
          candidates = [];
          refresh();
        };
        $("photoUndo").onclick = () => {
          if (!history.length) return;
          draft = history.pop();
          dirty = true;
          selected = -1;
          candidates = [];
          pinned = [-1, -1];
          searchEpoch++;
          refresh();
        };
        $("photoDeletePoint").onclick = () => {
          if (selected < 0) return;
          savePoint();
          draft.points.splice(selected, 1);
          const remap = (id) =>
            id === selected ? -1 : id > selected ? id - 1 : id;
          draft.starts = draft.starts.map(remap);
          pinned = pinned.map(remap);
          draft.top = remap(draft.top);
          selected = -1;
          invalidate();
          refresh();
        };
        $("photoSize").oninput = () => {
          cancelPointer();
          // A measured legacy draft keeps its calibration until the user
          // explicitly changes size. Convert at the current ratio without
          // rewriting any photo coordinates or historical ruler data.
          if (draft.scaleMode === "calibrated") {
            draft.estimatedUnits = previewBase;
            draft.scaleMode = "estimate";
          }
          draft.size = +$("photoSize").value;
          invalidate();
          refresh();
        };
        $("photoPickStart").onclick = () => {
          cancelPointer();
          editing = false;
          mode = "start";
          canvas.style.touchAction = "none";
          pinned = [-1, -1];
          pickHand = 0;
          draft.hip = null;
          refresh();
          status("点一个左手起点，再点一个右手起点。");
        };
        async function readFile(file) {
          if (!file || busy) return;
          if (
            !/^image\/(jpeg|png|webp|heic|heif)$/.test(file.type) ||
            file.size > 25 * 1024 * 1024
          ) {
            status(
              "请选择 25 MB 以内的照片（JPEG、PNG 或 WebP；HEIC 需浏览器支持）。",
              true,
            );
            return;
          }
          const token = ++epoch;
          busy = true;
          status("正在读取本机照片…");
          try {
            const image = await imageFrom(file),
              blob = await jpeg(image);
            if (token !== epoch || !dialog.open) return;
            source = image;
            photoBlob = blob;
            draft = newDraft();
            observed = "";
            savedJSON = "";
            pinned = [-1, -1];
            history = [];
            selected = -1;
            dirty = true;
            previewFrame = null;
            previewBase = null;
            choose(1);
          } catch (error) {
            status("无法读取照片，请转换为 JPEG 或 PNG 后重试。", true);
          } finally {
            busy = false;
            refresh();
          }
        }
        for (const id of ["photoFile", "photoCapture"])
          $(id).onchange = (event) => {
            const file = event.target.files[0];
            event.target.value = "";
            readFile(file);
          };
        $("photoChoose").onclick = () => {
          if (!busy) $("photoFile").click();
        };
        $("photoCamera").onclick = () => {
          if (!busy) $("photoCapture").click();
        };
        $("photoBack").onclick = () => {
          if (!busy) choose(step - 1);
        };
        $("photoSave").onclick = async () => {
          try {
            await persistDraft();
            status("草稿已保留，可随时关闭后继续。");
          } catch (error) {
            status("草稿未保存：" + error.message, true);
          }
        };
        $("photoNext").onclick = async () => {
          if (busy) return;
          if (step < 2) {
            if (visionConfig && $("photoMethod").value === "ai") await generateVision();
            else generateWall();
            return;
          }
          cancelPointer();
          if (!validDraft(draft) && !(await suggestStart())) return;
          const route = validDraft(draft);
          if (!route) {
            status(
              "草稿可以保留。还需一个起步：试试重新推荐、放大人物或换一组起手。",
              true,
            );
            return;
          }
          if (!records.some((r) => r.id === draft.id) && records.length >= 20) {
            status("本机最多保存 20 条照片线路，请先删除不需要的线路。", true);
            return;
          }
          busy = true;
          refresh();
          status("正在保存到本机…");
          try {
            await persistDraft();
            api.put(route);
            dirty = false;
            dialog.close();
            epoch++;
          } catch (error) {
            status(
              "保存失败，编辑内容仍在。请检查浏览器存储权限或剩余空间后重试。",
              true,
            );
          } finally {
            busy = false;
            refresh();
          }
        };
        function actionButton(text, handler) {
          const button = document.createElement("button");
          button.className = "photo-command";
          button.textContent = text;
          api.bindCommand(button, handler);
          return button;
        }
        async function library() {
          const token = epoch;
          const container = $("photoRecords");
          container.replaceChildren();
          try {
            const saved = await store("getAll");
            if (token !== epoch || !dialog.open || step !== -1) return;
            records = saved;
            records.sort((a, b) => b.updated - a.updated);
            if (!records.length) container.textContent = "暂无照片线路";
            for (const record of records) {
              const row = document.createElement("div");
              row.className = "photo-record";
              const title = document.createElement("strong");
              title.textContent = record.draft?.name || "无法读取的线路";
              row.append(title);
              const restored = migrate(record),
                route = restored ? validDraft(restored) : null;
              const tag = document.createElement("small");
              tag.className = "photo-privacy";
              tag.textContent = route
                ? route.scaleMode === "calibrated"
                  ? "已标定"
                  : "估算比例"
                : "待完善草稿";
              row.append(tag);
              if (route) {
                row.append(
                  actionButton("打开", () => {
                    if (busy) return;
                    api.put(route);
                    dialog.close();
                    epoch++;
                  }),
                );
              }
              if (restored) {
                row.append(actionButton("改名", async () => {
                  if (busy) return;
                  const name = prompt("线路名称", title.textContent)?.trim().slice(0, 40);
                  if (!name || name === title.textContent) return;
                  busy = true;
                  try {
                    const latest = (await store("getAll")).find(r => r.id === record.id);
                    if (!latest) throw new Error("线路已删除");
                    latest.draft.name = name;
                    await store("put", latest);
                    api.rename(record.id, name);
                    await library();
                  } catch (error) {
                    status("改名未保存，请重试。", true);
                  } finally { busy = false; }
                }));
                row.append(
                  actionButton("编辑", async () => {
                    if (busy) return;
                    busy = true;
                    const token = ++epoch;
                    try {
                      const image = await imageFrom(record.photo);
                      if (token !== epoch || !dialog.open) return;
                      source = image;
                      photoBlob = record.photo;
                      draft = copy(restored);
                      observed = savedJSON = JSON.stringify(draft);
                      pinned = [-1, -1];
                      dirty = false;
                      history = [];
                      selected = -1;
                      if (draft.points.length) preparePreview();
                      else choose(1);
                    } catch (error) {
                      status("照片数据无法读取，未修改已保存线路。", true);
                    } finally {
                      busy = false;
                      refresh();
                    }
                  }),
                );
              }
              row.append(
                actionButton("删除", async () => {
                  if (
                    busy ||
                    !confirm(
                      `删除“${title.textContent}”及其照片？此操作不可撤销。`,
                    )
                  )
                    return;
                  busy = true;
                  try {
                    await store("delete", record.id);
                    api.remove(record.id);
                    await library();
                    status("已从本机删除。");
                  } catch (error) {
                    status("删除失败，已保存内容未移除。", true);
                  } finally {
                    busy = false;
                  }
                }),
              );
              container.append(row);
            }
          } catch (error) {
            status(
              "无法访问本机存储。可以编辑照片，保存前需允许浏览器存储。",
              true,
            );
          }
        }
        api.bindCommand($("openPhotos"), async () => {
          if (dialog.open) return;
          api.pause();
          epoch++;
          draft = null;
          source = null;
          dirty = false;
          choose(-1);
          dialog.showModal();
          status("照片线路是平面动作草稿，不代表真实攀爬能力。");
          await library();
          await checkVision();
        });
        async function closeEditor() {
          if (visionController) {
            visionController.abort();
            visionController = null;
            busy = false;
            epoch++;
            refresh();
          }
          if (busy) {
            status("正在处理照片，请稍后关闭。");
            return;
          }
          cancelPointer();
          if (draft && photoBlob) {
            busy = true;
            try {
              await persistDraft();
            } catch (error) {
              status("草稿未保存，请点“重试保存”或再次关闭。", true);
              busy = false;
              return;
            }
            busy = false;
          }
          clearTimeout(saveTimer);
          epoch++;
          dialog.close();
          draft = null;
          source = null;
          photoBlob = null;
          history = [];
        }
        $("photoClose").onclick = closeEditor;
        dialog.addEventListener("cancel", (event) => {
          event.preventDefault();
          closeEditor();
        });
        dialog.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && gesture) {
            event.preventDefault();
            cancelPointer();
          }
        });
        dialog.addEventListener(
          "click",
          (event) => {
            if (busy && !["photoClose","photoCancelAI"].includes(event.target.closest("button")?.id)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true,
        );
        for (const button of dialog.querySelectorAll("button")) {
          const handler = button.onclick;
          if (!handler) continue;
          button.onclick = null;
          api.bindCommand(button, () => {
            if (busy && !["photoClose","photoCancelAI"].includes(button.id)) return;
            handler();
          });
        }
        // Saved definitions persist; in-progress play histories intentionally remain session-local.
        store("getAll")
          .then((saved) => {
            records = saved;
            for (const record of saved) {
              const restored = migrate(record),
                route = restored ? validDraft(restored) : null;
              if (route) api.put(route, false);
            }
          })
          .catch(() => {});
      })();
    </script>
  </body>
</html>
